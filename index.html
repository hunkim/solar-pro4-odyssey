<script>
(function() {
  'use strict';

  var DATA = {
    A: {
      subtitle: '서사시 운율을 살린 문어체 번역',
      body: `무인 들으소서, 그대 무나여, 숱한 환난을 겪은 사내의 이야기를, 트로이의 신성한 성을 무너뜨리고 나서 얼마나 많은 곳을 떠돌았는지, 갖은 사람들의 도시를 보고 그들의 마음을 알았는지를. 바다 위에서 얼마나 큰 고난을 겪었는지, 그 마음속 슬픔을 달래며 자신과 동료들의 귀향을 구하려 했는지를. 그러나 그는 동료들을 구하지 못했으니, 그들이 자신들의 어리석음으로 몰살했기 때문이라.
어리석은 자들! 그들이 헬리오스, 하이페리오스의 신성한 소를 끌어다 먹었기에, 그 신께서 그들의 귀향의 날을 앗아 가셨도다.
그대께서도 우리에게 말씀하소서, 모든 신의 여왕 자식인 제우스 여신, 그대 외에 다른 이들은 모두 피한 불운을 벗어나 이미 집에 머물고 있거니와, 오직 그이만은 귀향과 아내 그리는 마음에 사로잡혀 있으니, 고귀한 님프 칼립소가, 신들 중 빛나는 여인이, 깊은 동굴 속에 그를 억류하며 남편으로 삼고자 하였도다.

그러나 해와 해가 바뀌고 한 해가 차니, 신들이 그에게 이타카로 돌아가라 정해 준 때가 이르자, 그이는 거기서 아직 고역에서 벗어나지 못했고, 동료들 사이에서도 마찬가지로 모든 신들이 그를 불쌍히 여겼으되, 포세이돈만은 예외로 여겼도다. 그러나 그이는 여전히 큰 파도를 타고 앉아 갖가지 하면(舵)과 맞서며, 오디세우스가 고국의 땅에 닿을지 지켜보고 있었으니, 포세이돈이 아이티오페스 사람들에게 가 있었기 때문이라.
그 먼 아이티오페스 사람들— 세상 끝자락에 사는 이들, 지는 해와 뜨는 해 쪽으로 황소와 숫양을 백 마리씩 바치는 이들이여.

그때 그는 그 잔치에서 흥겨이 앉아 있었고, 다른 신들은 모두 올림포스의 제우스 궁전에 모여, 서로 내세워 말하였으니— 임금과 신들의 아비이신 제우스께서 말씀하셨으니, 흠 없는 아이기스토스 생각이 마음속에 떠올랐기 때문이라. 아가멤논의 아들 오레스테스가 그를 확실한 죽음으로 죽였을 때, 그가 신들 앞에서 생각하고 말씀하심이로다.
"아, 지독하도다! 사람들이 신들에게 허물 지우는 꼴이로다. 그들은 저희 쪽에서 악행을 했기 때문에 재앙이 온다고 하지만, 도리어 저희 자신이 저희 허물로 지나친 죽음을 부르는 고난을 지고 있구나. 보라, 이제 아이기스토스도 지나친 죽음을 부를 짓을 저질렀구나. 아트레우스 아들의 아내를 꾀어 데려다 차지하였으니, 그가 돌아올 때 날카로운 파멸을 겪으리라는 것을 알면서도 그를 죽였구나. 그 전에 우리가 그에게 헤르메스를 보내어, 날카로운 눈을 가진 이를 시켜 말하게 했건만— 그를 죽이지도 말고 아내를 아내로 삼지도 말라 일렀으니, 오레스테스가 아트레우스의 아들에게 되갚을 것이요, 그가 자라 마음이 원하는 나이가 되리라고. 그렇게 헤르메스가 말했지만, 선한 마음을 가진 아이기스토스는 듣지 못하고, 모두 한꺼번에 그 값을 치렀다."
이때 빛나는 눈의 여신 아테나가 대답했도다.
"아버지, 우리 모두의 아버지, 크로노스의 아들이시여, 모든 존재의 주재자시여, 그는 이미 딱한 재앙에 겹겹이 누웠고, 또 그런 짓을 하는 다른 이도 몰락을 맞을 터이니, 더 나아가 이루실 일이 무엇이겠습니까? 그러나 내 마음은 오디세우스, 슬기로운 사내의 일로 앓으니, 그가 오래도록 동료 없이 바다 한가운데 섬에서 환난을 겪고 있도다. 그곳은 바다 한가운데 섬, 바다의 배꼽이라 불리며, 숲이 우거진 섬, 그곳에는 거친 마음의 여신, 아틀라스의 딸이 살고, 각자 긴 기둥을 잡고 있어 그 기둥이 땅을 꼭 잡고 하늘도 꼭 붙들고 있도다. 그 여신의 손에 가엾은 그가 탄식하며 억류되어, 언제나 부드러운 말과 타이름으로 달래어, 그가 이타카를 잊도록 하고 있도다. 그러나 오디세우스는 떠나고자 하여, 피어오르는 연기를 보고 어느 땅에서 죽고자 하는지 마음먹고 있도다. 그런데 당신께서는 올림포스의 신이시여, 그이의 마음을 굽어보지 않으시니, 그가 트로이아의 넓은 곳에서 소와 아르골인들의 배 앞에서 당신께 제물을 바쳤거늘, 무엇이 당신을 그토록 분노하게 하였습니까, 제우스여?"
이를 듣고 구름을 모으는 자 제우스가 말했도다.
"내 아이야, 무슨 말을 네 입술을 벗어났느냐? 내가 어찌 신성한 오디세우스를, 나를 가장 높이 아는 이를 잊겠느냐? 그는 사람들 가운데 내 마음에 가장 들었고, 신들의 신성한 제사에도 온전한 몫을 내게 바쳤으니, 이 자들은 높은 하늘을 잡고 있구나. 그러나 땅을 흔드는 포세이돈은 변함없이 노여워하고 있으니, 그가 신의 눈으로 퀴클롭스 폴리페모스의 눈을 쳤기 때문이라. 폴리페모스는 모든 퀴클롭스 중 가장 큰 권세를 지녔고, 거친 바다의 목자 포르퀴스의 딸, 고요한 바다를 깊이 생각하는 여인이 낳았으며, 깊은 동굴에서 포세이돈과 결합하여 낳았으니, 포세이돈, 땅을 뒤흔드는 자가 오디세우스를 죽이지 않고, 그의 고향 땅에서 멀리 떨어져 있게 괴롭히는도다. 그러나 우리 모두 함께 논의하여 그가 어떻게든 귀향하도록 설득하자. 포세이돈도 그의 분노를 굽히리니, 모든 불멸의 신의 호의 앞에 아무것도 막지 못할 것이므로."
이때 빛나는 눈의 아테나가 다시 말했도다.
"아버지, 우리 모두의 아버지, 크로노스의 아들이시여, 모든 존재의 주재자시여, 이제 그대 뜻이 불멸의 신들에게 기쁨이 된다면, 오디세우스, 슬기로운 그이를 이 집으로 귀향하게 하소서. 저는 전령 헤르메스를 오기기아 섬으로 보내어, 머리 긴 여신에게 빨리 진실을 전해, 오디세우스의 애타는 귀향이 이루어지게 하겠습니다. 그리고 저는 이타카로 가서 그의 아들을 북돋우어, 신의 마음을 그의 속에 넣어, 머리를 흐트러뜨린 아카이아 백성들을 아고라에 불러 모아, 모든 구혼자들에 맞서게 하고, 그들이 늘 그의 양과 굽은 뿔의 소를 잡아먹는 것을 멈추게 하겠습니다. 또한 저는 스파르타와 퓔라스로 보내어, 그의 아버지의 귀향 소식을 찾게 하겠습니다. 그가 듣거든, 좋은 소문이 사람들 사이에 퍼지도록."
이렇게 말하고 그녀는 발밑에 아름다운 신적인 신발, 황금 신을 신었으니, 그 신들은 그녀에게 젖은 땅과 끝없는 땅을 날개 달게 하여 바람과 함께 달리게 했도다. 그녀는 사납고 날카로운 큰 청동 창을 집어 들었으니, 무겁고 큰 창은 강력한 힘으로 용맹한 줄을 제압하고, 거만한 자들에게 분노하는 것이라. 그녀는 올림포스의 봉우리를 넘어 내려와, 이타카 땅에 있는 사람들 집 앞, 오디세우스의 문턱과 문전, 손에 날카로운 청동 창을 쥐고, 타피오스의 우두머리, 접대자 메넬토스에게 갔도다.
그리고 구혼자들을 보았으니, 그들은 문 앞 상 앞에 앉아 술잔을 들고, 마음속에 환락을 누리고 있었도다. 그들은 스스로 잡아죽인 황소의 가죽 위에서 즐겼고, 전령과 빠른 시종들이 잔과 물을 섞으며, 해면 스펀지로 상을 씻고 차리고, 많은 고기를 잘라 먹고 있었도다.
이윽고 신성한 텔레마코스가 먼저 알았으니, 그는 구혼자 사이에 앉아 아버지 그리움에 마음 아파하며, 혹시 아버지가 어디서 와서 구혼자들을 흩어 버리고 명예와 집 다스리는 권한을 스스로 갖게 되려나 마음속에 생각하면서, 그의 속마음으로는 구혼자들에게 말하려 하고 있었도다.
그가 아테나를 보자 곧 문 쪽으로 곧장 나아가, 마음속 깊이 화가 나, 오래도록 문 곁에 선 나그네에게 가까이 가서 오른손을 잡고 청동 창을 받아 들고, 그에게 날개 달린 말을 했도다.
"나그네여, 안녕하소서. 우리 집에 오는 것이 반갑습니다. 저녁을 먹은 뒤 여러 가지를 말씀드리리니, 당신께 필요한 것을."
이렇게 말하자 팔라스 아테나가 그를 따랐도다.
그들이 집 안 높은 곳에 이르자, 그는 창을 들고 기둥 옆 장창을 세워 뒀으니, 오디세우스의 다른 견딜 만한 무기들이 기대어 있던 곳이라. 그녀는 그녀를 아름다운 무늬 의자에 앉히고, 아래 양탄자를 넓게 펼쳤으며, 그녀 옆에도 자리를 잡고 앉아 구혼자들과 떨어져 손님으로 불쾌하지 않게 하며, 흥청대는 잔치 소리에 섞이지 않고, 아버지 일을 물었도다. 시녀가 물동이를 가져와 씻을 물을 부었으니, 금빛 물병을 은빛 대야에 받치고. 귀족의 상보(손 씻을 그릇)를 펴고, 겸손한 하녀가 여러 음식을 차려 손님들을 기쁘게 하며, 상 위에 여러 고기의 접시를 올리고, 금잔을 곁들이고, 전령이 그들에게 잔을 따랐도다. 구혼자들이 안으로 들어오니, 그들은 걸상과 의자에 차례로 앉고, 전령이 손에 물을 붓고, 하녀들이 바구니에 음식을 담아 내밀며, 젊은이들이 잔을 채웠도다. 그들은 차려진 선물들에 손을 내밀고, 마시고 배부르자 잔치 즐기러 들어, 마음속에 노래와 춤이 향긋한 음식 가운데 있었도다. 전령이 손에 아름다운 키타라를 쥐어 주자, 데모도코스가 노래하기 시작하며, 구혼자 앞에서 부득이하게 아름다운 노래를 이끌어 내었다. 그때 텔레마코스가 빛나는 눈의 아테나에게 다가가 머리를 숙여 말했으니, 다른 손님들에게 들리지 않게 하려는 것이었도다.
"나그네여, 당신 마음이 내게 거슬리지 않으면, 내가 말한들 허락하시리니, 이 사람들에게 탄원거리가 무엇인지—키타라는 탄식스러우며, 노래도 그러하니, 그들의 빈둥거리는 살이 남의 것이요, 어떤 사람의 하얀 뼈가 비에 젖어 들판이나 바닷물 출렁이는 섬에 누워, 만일 그들이 이타카로 돌아오는 그를 본다면, 모든 이들이 더 빨리 달리거나 더 부유한 사람이 되고 금과 옷을 더 많이 가지기를 바랐을 터인데, 이제 그가 비참한 파멸로 사라졌고, 우리에게는 어떤 위로도 없구나. 만일 사람이 땅에서 장차 우리 돌아간다 말하더라도, 그의 귀향하는 날은 사라졌도다 — 당신에게 말하리니, 분명히 말하라. 어떤 사내가 이 사람들 가운데서 왔는지, 그의 고장과 도시, 어떤 배로 이타카로 왔는지, 선원들이 어떻게 그를 이타카로 데려왔는지, 그가 어떤 사람인지, 무엇을 일컬어지는지, 나는 그가 걸어서 왔다 생각지 않으니, 당신의 진실을 말하라, 내가 알게 하라. 아니면 새로운 소식이라 말하든지, 아니면 당신이 우리 집의 나그네인지."
이에 빛나는 눈의 아테나가 대답했도다.
"진실로 네가 이것을 네게 밝히리니, 나는 멘테스요, 앙키알로스의 아들, 슬기로운 이의 아들이며, 나는 스스로 타피오스의 사람들을 다스리니, 지금 나는 배로 바다 저편, 다른 부류의 사람들 쪽으로, 텔레마코스의 동료들과 함께 울리는 쇠와 빛나는 철을 싣고 테메시 쪽으로 가노라. 내 배는 여기서 들판 곁, 도시 밖, 레이트로스 만 좁은 항구, 네이오스 숲 아래 있도다. 나그네들 서로 혈족이라, 우리는 처음부터 서로를 믿는도다. 네가 늙은 라에르테스가 어디 있는지 물었거늘, 그 영웅은 이제 도시로 가려 하지 않고, 들판 밖에서 환난 겪으며 노년과 하녀와 먹고 마시다가, 힘이 무릎 밑으로 덜어지면 포도밭 둑을 따라 기어다니곤 하더라. 그러나 이제 그들은 네가 그의 아버지라 여겨 왔으니, 그가 바깥에서 돌아왔다 생각했기 때문이라. 그러나 신들이 그의 길을 망쳐 놓았구나. 그는 아직 죽지 않았으니, 신성한 오디세우스는 땅 위가 아니라, 여전히 바다 한가운데 먼 섬에서 가엾게 갇혀 있도다. 거친 이들이 그를 붙잡고 있으니, 아마 그이가 그를 속여 붙들어 두었으리라. 그러나 이제 내가 네게 마음속으로 말하리라 — 불멸의 신들이 어떤 생각을 품고 있는지, 그리고 내가 아는 어떤 일이 이루어질지. 나 또한 신탁도 새 징조도 뚜렷이 알지 못하나니, 네가 사랑스런 고향을 오래 떠나지 않으리라, 비록 네가 포위되더라도, 그가 많이 꾀하는 자이니 피할 줄 알리라. 그러나 나에게 이것을 말하라, 분명히 말하라. 네가 오디세우스와 비슷하게 나이 든 아들이라면, 네가 그이를 빼닮았으니— 머리와 눈빛이 아름답구나. 네가 자주 그이와 함께 섞였으니, 트로이아 전쟁을 보러 가기 전에, 뛰어난 다른 아르골인들이 빈 배에 오를 때. 그때 나는 오디세우스를 보지 못했고, 그이도 나를 거기서 보지 못했도다."
이때 텔레마코스가 신중한 마음으로 대답했도다.
"나그네여, 나는 당신이 말한 것이 진실인가 묻노니, 내 어머니는 그가 내 아버지라 말하지만, 나 자신은 알지 못하노니, 아무도 스스로 자기 자식을 알지 못했기 때문이라. 그러니 나는 타인의 아들 중 가장 가련한 자가 되었도다. 그러나 당신이 내 아버지의 친구가 되셨다면 좋았으리라. 그러나 이제 내가 진실을 말하리라 — 어머니가 그가 내 아버지라 말하지만, 나 자신이 누구인지 알지 못하노라. 그렇게 당신이 나를 시험하는 것은 옳지 않도다."
이때 빛나는 눈의 아테나가 다시 말했도다.
"참으로 아무도 네게 네 혈통을 거슬러 말하지 않았고, 신들도 네게 가문 이름을 뒤에 남기지 않았으니, 너는 페넬로페가 낳았음이라. 그러니 이것을 말하라, 분명히 말하라— 어떤 잔치며 어떤 모임이 여기 열렸는지, 왜 그리 잔치를 베푸는지, 구혼자 모임인지 혼인 잔치인지— 그들은 잔치도 아니면서, 그 집에서 거만하게, 건방지게, 손님에 먹는 것으로 보이는 듯하니, 어떤 이가 많은 부끄러움을 보러 왔다면 마음 아파할 일이도다."
이때 텔레마코스가 신중한 마음으로 대답했도다.
"나그네여, 당신 말이 참으로 듣기 좋고 생각이 깊구나, 아버지처럼 아이에게 말하듯. 그러나 결코 당신을 잊지 않으리니, 이제 잔치에 머물며, 마음이 괴롭지만 당신께 줄 선물로 배에 오르리, 즐거운 마음으로 귀한 선물을 당신에게 드리리니, 친구가 친구에게 주는 것이로다."
이때 빛나는 눈의 아테나가 다시 말했도다.
"당신이 이제 머무르라, 길을 서두르고 싶으나, 당신 마음이 기뻐할 선물을 주고 싶어 하니, 돌아갈 때 집까지 데려다주고 아주 고운 것을 고르리니, 당신이 마땅한 보상을 받으리라."
그리고 빛나는 눈의 아테나가 물러났도다. 날개 달린 새처럼 소리 없이 날아올라, 그녀의 가슴을 힘과 용기로 채우고, 그녀의 아버지가 전보다 더 생각났도다. 그는 마음속으로 깨닫고 몹시 놀라 가슴이 뛰었으니, 그가 신임을 알았음이라. 곧바로 신과 같은 얼굴로 구혼자들에게 가고, 시인이 그들에게 노래했으니, 확실히 들리는 노래를, 그리고 그들이 잠잠히 들었도다. 아카이아인들의 귀향 노래를 불러 주었으니, 트로이아에서 돌아온 슬픔의 귀향 노래요. 팔라스 아테나가 이카리오스의 지혜로운 딸, 마음 높은 여인 페넬로페에게 그 노랫뜻을 생각하게 하였도다. 그녀는 높은 사다리에서 내려와 집 안으로 내려오니, 페넬로페는 그 노래를 못 견뎌 하여, 두 하녀가 함께 왔고, 그녀가 구혼자들 앞에 이르니, 여인들 중 빛나는 이, 저울 곁에 서서 짠 것 옆 문 앞에 머리를 묶어 풀어 젖히고, 눈물 젖은 머리띠를 씻은 채, 한 하녀가 그녀 양 옆에서 흐느끼며 말했도다. "신의 시인 데모도코스여, 당신은 사람들의 마음을 누그러뜨리는 많은 것을 알고 있으니, 신들과 사람들의 행적, 시인들이 칭송하는 모든 것을 아시나니, 지금 당신에게 하나를 들려주소서." 그들이 잠잠히 포도주 마시며 이 노랫소리를 그쳤으니, 이 슬픈 노래가 늘 그녀의 가슴에 사랑스러운 것을 끌어당겨, 가장 깊은 슬픔이 그녀에게 덮쳤기 때문이라. 그녀는 늘 그이를 그리워했으니, 기억 속에 늘 명성 높은 그리스와 중부 아르고스에 널리 퍼진 사내를.
이때 텔레마코스가 신중한 마음으로 대답했도다.
"어머니, 왜 합창하는 시인에게 화를 내십니까, 그의 마음이 이끄는 대로 노래하게 하는 것인데, 시인이 죄인이 아니라, 죄인이 제우스시니, 제우스께서 사람들에게 원하는 대로 주시므로 아카이아인들이 불만 없어 하리로다. 이러한 노래야말로 사람들에게 가장 칭송받으니, 듣는 이에게 가장 새롭게 감싸듯 다가오는 노래라. 당신 마음은 참으시고 들으소서. 오디세우스 혼자 귀향을 잃은 것이 아니라, 트로이아에서 많은 다른 이가 죽었으므로, 집으로 돌아가 당신 일(길쌈)을 돌보시고, 베틀과 북, 하녀들에게 일을 시키소서. 말은 모든 남자에게 맞으니, 무엇보다 내게 맞으니, 이 집에서 내 권한이 있도다."
그리고 페넬로페는 놀라워하며 다시 집으로 걸어 돌아갔도다. 아들 말을 마음 깊이 간직하며, 위층 방으로 올라가 하녀들과 함께 울었으니, 잠이 오디세우스의 사랑스러운 눈꺼풀에 내려앉기를 바라면서.
이리하여 빛나는 눈의 아테나가 구혼자들을 부추겼으니, 그들은 넓은 집 안에서 떠들고, 모두 죽은 듯 누우려 하였도다. 이때 신중한 텔레마코스가 말 시작했도다.
"어머니 아들들, 구혼자들이여, 지나친 거만을 지닌 자들, 오늘 밤은 먹고 즐기자, 소란 없이. 이것이 좋으니, 노래 잘 하는 시인의 말을 듣기에, 그런 목소리는 신과 같은 것이라. 내일 아침 일찍 광장으로 가서 모두 모이자, 당신에게 거리낌 없이 말 전하려고. 당신들은 잔치 자리를 다르게 차리고, 각 집에서 먹고 부족한 것 서로 바꾸자. 그대들에게 이것이 더 낫고 좋다면, 한 사람의 빈둥거리는 살이 죽는 편이 낫다 생각하면, 나는 늘 계신 신들에게 호소하리라. 만일 제우스께서 그들에게 되갚는 일을 주신다면, 이 집 안에 있던 자들이 망할 것이니라."
이렇게 말하자 그들 모두 입술을 깨물며 그를 놀라워하였으니, 그가 겁 없이 말했기 때문이라. 에우페이테스의 아들 안티노오스가 말했도다. "텔레마코스여, 과연 신들이 당신 스스로 가르쳐 높은 말 겁 없이 말하게 하셨구나. 크로노스의 아들 제우스께서 당신을 이타카에서 왕으로 만들지 않으시길, 그것은 당신 핏줄에서 나왔으니. 그러나 당신에게 말하노니, 신들이 당신에게 노여워하면, 이것이 사람들의 가장 나쁜 짓이로다."
이에 텔레마코스가 신중한 마음으로 대답했도다. "안티노오스여, 당신 말씀을 내가 노여워한다면, 당신 바람이 제우스 뜻으로 받으시기를 바라노라. 그러나 당신 말씀대로 이것이 가장 나쁜 일이라면, 바로 당신 재산이 늘었고 당신 스스로 더 커지리라. 그러나 왕들, 아카이아인들의 왕들 많이 있으니, 이타카 땅에 젊은이, 늙은이 많으니, 그들이 만일 이 일을 얻는다면, 오디세우스 죽었을 때. 그러나 나는 그 집 주인이 되리니, 우리 집으로. 그 재산은 오디세우스가 내게 맡겼도다."
폴리부스의 아들 에우뤼마코스가 그에게 대답했도다. "텔레마코스여, 이 일은 신들의 무릎에 달려 있으니, 누가 이타카에서 아카이아인들을 다스릴지. 당신에게 재산이 있고 집 다스리기 바라니, 누군가 당신에게 억지로 힘으로 재산을 빼앗으려 한다면, 이타카가 아직 살아 있는 동안 그가 당신을 무너뜨리리라. 그러나 내가 당신에게 묻는 것은 그 나그네에 관하여, 어디서 온 사람인지, 어떤 땅에서 이를 바라보는지, 그의 가문과 고향은 어디인지, 아버지 소식을 가져왔는지, 아니면 스스로 부탁하러 왔는지— 곧장 왔다가 재빨리 사라졌으니, 당신에게 묻지 못하겠구나. 그는 보기에 나쁜 것으로 보이지 않았으니, 당신이 그를 보고도 알아보지 못해서라."

이윽고 신성한 텔레마코스가 먼저 알았으니, 그는 구혼자 사이에 앉아 아버지 그리움에 마음 아파하며, 혹시 아버지가 어디서 와서 구혼자들을 흩어 버리고 명예와 집 다스리는 권한을 스스로 갖게 되려나 마음속 생각하면서, 그의 속마음으로는 구혼자들에게 말하려 하고 있었도다. 그가 아테나를 보자 곧 문 쪽으로 곧장 나아가, 마음속 깊이 화가 나 오래도록 문 곁에 선 나그네에게 가까이 가서 오른손을 잡고 청동 창을 받아 들고, 그에게 날개 달린 말을 했도다.
"나그네여, 안녕하소서. 우리 집에 오는 것이 반갑습니다. 저녁을 먹은 뒤 여러 가지를 말씀드리리니, 당신께 필요한 것을."
이렇게 말하자 팔라스 아테나가 그를 따랐도다. 그들이 집 안 높은 곳에 이르자, 그는 창을 들고 기둥 옆 장창을 세워 뒀으니, 오디세우스의 다른 무기들이 기대어 있던 곳이라. 그녀는 그녀를 아름다운 무늬 의자에 앉히고 아래 양탄자를 넓게 펼쳤으며, 그녀 옆에도 자리를 잡고 앉아 구혼자들과 떨어져 손님으로서 불쾌하지 않게 하며, 흥청대는 잔치 소리에 섞이지 않고 아버지 일을 물었도다. 시녀가 물동이를 가져와 씻을 물을 부었으니, 금빛 물병을 은빛 대야에 받치고. 귀족의 상보(손 씻을 그릇)를 펴고, 겸손한 하녀가 여러 음식을 차려 손님들을 기쁘게 하며, 상 위에 여러 고기의 접시를 올리고 금잔을 곁들이고 전령이 잔을 따랐도다. 구혼자들이 안으로 들어오니, 걸상과 의자에 차례로 앉고, 전령이 손에 물을 붓고 하녀들이 바구니에 음식을 담아 내밀며 젊은이들이 잔을 채웠도다. 차려진 선물들에 손을 내밀고, 마시고 배부르자 잔치 즐기러 들어, 마음속 노래와 춤이 향긋한 음식 가운데 있었도다. 전령이 손에 아름다운 키타라를 쥐어 주자, 데모도코스가 노래하기 시작하며 구혼자 앞에서 부득이하게 아름다운 노래를 이끌어 내었다.
이때 텔레마코스가 빛나는 눈의 아테나에게 다가가 머리를 숙여 말했으니, 다른 손님들에게 들리지 않게 하려는 것이었도다.
"나그네여, 당신 마음이 내게 거슬리지 않으면 내가 말한들 허락하시리니, 이 사람들에게 탄원거리가 무엇인지—키타라는 탄식스럽고 노래도 그러하니, 그들의 빈둥거리는 살이 남의 것이요, 어떤 사람의 하얀 뼈가 비에 젖어 들판이나 바닷물 출렁이는 섬에 누워, 만일 그들이 이타카로 돌아오는 그를 본다면, 모든 이들이 더 빨리 달리거나 더 부유한 사람이 되고 금과 옷을 더 많이 가지기를 바랐을 터인데, 이제 그가 비참한 파멸로 사라졌고 우리에게는 아무 위로도 없구나. 만일 사람이 땅에서 장차 우리 돌아간다 말하더라도, 그의 귀향하는 날은 사라졌도다. 당신에게 말하리니, 분명히 말하라. 어떤 사내가 이 사람들 가운데서 왔는지, 그의 고장과 도시, 어떤 배로 이타카로 왔는지, 선원들이 어떻게 그를 이타카로 데려왔는지, 그가 어떤 사람인지, 무엇을 일컫는지, 나는 그가 걸어서 왔다 생각지 않으니, 당신의 진실을 말하라. 그래야 내가 알게 되리라. 아니면 새로운 소식이라 말하든지, 아니면 당신이 우리 집의 나그네인지."
이에 빛나는 눈의 아테나가 대답했도다.
"진실로 네가 이것을 네게 밝히리니, 나는 멘테스요, 앙키알로스의 아들, 슬기로운 이의 아들이며, 나는 스스로 타피오스의 사람들을 다스리니, 지금 나는 배로 바다 저편, 다른 부류의 사람들 쪽으로, 텔레마코스의 동료들과 함께 울리는 쇠와 빛나는 철을 싣고 테메시 쪽으로 가노라. 내 배는 여기서 들판 곁, 도시 밖, 레이트로스 만 좁은 항구, 네이오스 숲 아래 있도다. 나그네들 서로 혈족이라, 우리는 처음부터 서로를 믿는도다. 네가 늙은 라에르테스가 어디 있는지 물었거늘, 그 영웅은 이제 도시로 가려 하지 않고, 들판 밖에서 고난 겪으며 노년과 하녀와 먹고 마시다가, 힘이 무릎 밑으로 덜어지면 포도밭 둑을 따라 기어다니곤 하더라. 그러나 이제 그들은 네가 그의 아버지라 여겨 왔으니, 그가 바깥에서 돌아왔다 생각했기 때문이라. 그러나 신들이 그의 길을 망쳐 놓았구나. 그는 아직 죽지 않았으니, 신성한 오디세우스는 땅 위가 아니라, 여전히 바다 한가운데 먼 섬에서 가엾게 갇혀 있도다. 거친 이들이 그를 붙잡고 있으니, 아마 그이가 그를 속여 붙들어 두었으리라. 그러나 이제 내가 네게 마음속으로 말하리라—불멸의 신들이 어떤 생각을 품고 있는지, 그리고 내가 아는 어떤 일이 이루어질지. 나 또한 신탁도 새 징조도 뚜렷이 알지 못하나니, 네가 사랑스런 고향을 오래 떠나지 않으리라, 비록 네가 포위되더라도, 그가 많이 꾀하는 자이니 피할 줄 알리라. 그러나 나에게 이것을 말하라, 분명히 말하라. 네가 오디세우스와 비슷하게 나이 든 아들이라면, 네가 그이를 빼닮았으니—머리와 눈빛이 아름답구나. 네가 자주 그이와 함께 섞였으니, 트로이아 전쟁을 보러 가기 전에, 뛰어난 다른 아르골인들이 빈 배에 오를 때. 그때 나는 오디세우스를 보지 못했고, 그이도 나를 거기서 보지 못했도다."
이때 텔레마코스가 신중한 마음으로 대답했도다.
"나그네여, 나는 당신이 말한 것이 진실인가 묻노니, 내 어머니는 그가 내 아버지라 말하지만, 나 자신은 알지 못하노니, 아무도 스스로 자기 자식을 알지 못했기 때문이라. 그러니 나는 타인의 아들 중 가장 가련한 자가 되었도다. 그러나 당신이 내 아버지의 친구가 되셨다면 좋았으리라. 그러나 이제 내가 진실을 말하리라—어머니가 그가 내 아버지라 말하지만, 나 자신이 누구인지 알지 못하노라. 그렇게 당신이 나를 시험하는 것은 옳지 않도다."
이때 빛나는 눈의 아테나가 다시 말했도다.
"참으로 아무도 네게 네 혈통을 거슬러 말하지 않았고, 신들도 네게 가문 이름을 뒤에 남기지 않았으니, 너는 페넬로페가 낳았음이라. 그러니 이것을 말하라, 분명히 말하라—어떤 잔치며 어떤 모임이 여기 열렸는지, 왜 그리 잔치를 베푸는지, 구혼자 모임인지 혼인 잔치인지—그들은 잔치도 아니면서, 그 집에서 거만하게, 건방지게, 손님에 먹는 것으로 보이는 듯하니, 어떤 이가 많은 부끄러움을 보러 왔다면 마음 아파할 일이도다."
이때 텔레마코스가 신중한 마음으로 대답했도다.
"나그네여, 당신 말이 참으로 듣기 좋고 생각이 깊구나, 아버지처럼 아이에게 말하듯. 그러나 결코 당신을 잊지 않으리니, 이제 잔치에 머물며, 마음이 괴롭지만 당신께 줄 선물로 배에 오르리, 즐거운 마음으로 귀한 선물을 당신에게 드리리니, 친구가 친구에게 주는 것이로다."
이때 빛나는 눈의 아테나가 다시 말했도다.
"당신이 이제 머무르라, 길을 서두르고 싶으나, 당신 마음이 기뻐할 선물을 주고 싶어 하니, 돌아갈 때 집까지 데려다주고 아주 고운 것을 고르리니, 당신이 마땅한 보상을 받으리라."
그리고 빛나는 눈의 아테나가 물러났도다. 날개 달린 새처럼 소리 없이 날아올라, 그녀의 가슴을 힘과 용기로 채우고, 그녀의 아버지가 전보다 더 생각났도다. 그는 마음속으로 깨닫고 몹시 놀라 가슴이 뛰었으니, 그가 신임을 알았음이라. 곧바로 신과 같은 얼굴로 구혼자들에게 가고, 시인이 그들에게 노래했으니, 확실히 들리는 노래를, 그리고 그들이 잠잠히 들었도다. 아카이아인들의 귀향 노래를 불러 주었으니, 트로이아에서 돌아온 슬픔의 귀향 노래요. 팔라스 아테나가 이카리오스의 지혜로운 딸, 마음 높은 여인 페넬로페에게 그 노랫뜻을 생각하게 하였도다. 그녀는 높은 사다리에서 내려와 집 안으로 내려오니, 페넬로페는 그 노래를 못 견뎌 하여, 두 하녀가 함께 왔고, 그녀가 구혼자들 앞에 이르니, 여인들 중 빛나는 이, 저울 곁에 서서 짠 것 옆 문 앞에 머리를 묶어 풀어 젖히고, 눈물 젖은 머리띠를 씻은 채, 한 하녀가 그녀 양 옆에서 흐느끼며 말했도다. "신의 시인 데모도코스여, 당신은 사람들의 마음을 누그러뜨리는 많은 것을 알고 있으니, 신들과 사람들의 행적, 시인들이 칭송하는 모든 것을 아시나니, 지금 당신에게 하나를 들려주소서." 그들이 잠잠히 포도주 마시며 이 노랫소리를 그쳤으니, 이 슬픈 노래가 늘 그녀의 가슴에 사랑스러운 것을 끌어당겨, 가장 깊은 슬픔이 그녀에게 덮쳤기 때문이라. 그녀는 늘 그이를 그리워했으니, 기억 속에 늘 명성 높은 그리스와 중부 아르고스에 널리 퍼진 사내를.
이때 텔레마코스가 신중한 마음으로 대답했도다.
"어머니, 왜 합창하는 시인에게 화를 내십니까, 그의 마음이 이끄는 대로 노래하게 하는 것인데, 시인이 죄인이 아니라, 죄인이 제우스시니, 제우스께서 사람들에게 원하는 대로 주시므로 아카이아인들이 불만 없어 하리로다. 이러한 노래야말로 사람들에게 가장 칭송받으니, 듣는 이에게 가장 새롭게 감싸듯 다가오는 노래라. 당신 마음은 참으시고 들으소서. 오디세우스 혼자 귀향을 잃은 것이 아니라, 트로이아에서 많은 다른 이가 죽었으므로, 집으로 돌아가 당신 일(길쌈)을 돌보시고, 베틀과 북, 하녀들에게 일을 시키소서. 말은 모든 남자에게 맞으니, 무엇보다 내게 맞으니, 이 집에서 내 권한이 있도다."
그리고 페넬로페는 놀라워하며 다시 집으로 걸어 돌아갔도다. 아들 말을 마음 깊이 간직하며, 위층 방으로 올라가 하녀들과 함께 울었으니, 잠이 오디세우스의 사랑스러운 눈꺼풀에 내려앉기를 바라면서.
이리하여 빛나는 눈의 아테나가 구혼자들을 부추겼으니, 그들은 넓은 집 안에서 떠들고, 모두 죽은 듯 누우려 하였도다. 이때 신중한 텔레마코스가 말 시작했도다.
"어머니 아들들, 구혼자들이여, 지나친 거만을 지닌 자들, 오늘 밤은 먹고 즐기자, 소란 없이. 이것이 좋으니, 노래 잘 하는 시인의 말을 듣기에, 그런 목소리는 신과 같은 것이라. 내일 아침 일찍 광장으로 가서 모두 모이자, 당신에게 거리낌 없이 말 전하려고. 당신들은 잔치 자리를 다르게 차리고, 각 집에서 먹고 부족한 것 서로 바꾸자. 그대들에게 이것이 더 낫고 좋다면, 한 사람의 빈둥거리는 살이 죽는 편이 낫다 생각하면, 나는 늘 계신 신들에게 호소하리라. 만일 제우스께서 그들에게 되갚는 일을 주신다면, 이 집 안에 있던 자들이 망할 것이니라."
이렇게 말하자 그들 모두 입술을 깨물며 그를 놀라워하였으니, 그가 겁 없이 말했기 때문이라. 에우페이테스의 아들 안티노오스가 말했도다. "텔레마코스여, 과연 신들이 당신 스스로 가르쳐 높은 말 겁 없이 말하게 하셨구나. 크로노스의 아들 제우스께서 당신을 이타카에서 왕으로 만들지 않으시길, 그것은 당신 핏줄에서 나왔으니. 그러나 당신에게 말하노니, 신들이 당신에게 노여워하면, 이것이 사람들의 가장 나쁜 짓이로다."
이에 텔레마코스가 신중한 마음으로 대답했도다. "안티노오스여, 당신 말씀을 내가 노여워한다면, 당신 바람이 제우스 뜻으로 받으시기를 바라노라. 그러나 당신 말씀대로 이것이 가장 나쁜 일이라면, 바로 당신 재산이 늘었고 당신 스스로 더 커지리라. 그러나 왕들, 아카이아인들의 왕들 많이 있으니, 이타카 땅에 젊은이, 늙은이 많으니, 그들이 만일 이 일을 얻는다면, 오디세우스 죽었을 때. 그러나 나는 그 집 주인이 되리니, 우리 집으로. 그 재산은 오디세우스가 내게 맡겼도다."
폴리부스의 아들 에우리마코스가 그에게 대답했도다. "텔레마코스여, 이 일은 신들의 무릎에 달려 있으니, 누가 이타카에서 아카이아인들을 다스릴지. 당신에게 재산이 있고 집 다스리기 바라니, 누군가 당신에게 억지로 힘으로 재산을 빼앗으려 한다면, 이타카가 아직 살아 있는 동안 그가 당신을 무너뜨리리라. 그러나 내가 당신에게 묻는 것은 그 나그네에 관하여, 어디서 온 사람인지, 어떤 땅에서 이를 바라보는지, 그의 가문과 고향은 어디인지, 아버지 소식을 가져왔는지, 아니면 스스로 부탁하러 왔는지—곧장 왔다가 재빨리 사라졌으니, 당신에게 묻지 못하겠구나. 그는 보기에 나쁜 것으로 보이지 않았으니, 당신이 그를 보고도 알아보지 못해서라."
이에 텔레마코스가 신중한 마음으로 대답했도다. "에우리마코스여, 내 아버지의 귀향은 사라졌도다. 나는 소식을 믿지 않으며, 그가 어디서 온다면 믿지 않노라. 신의 신탁도 믿지 않노라. 어머니가 큰 방에서 어떤 예언자를 불러 신 신탁자에게 물으라 하거든, 이 나그네는 내 아버지의 혈족, 타피온에서 온 자요, 멘테스는 앙키알로스의, 슬기로운 이의 아들이라, 스스로 타피온 사람들을 다스리니, 그렇게 말하노라." 이렇게 텔레마코스가 말하자, 그는 불멸의 여신을 마음속으로 알았도다. 그리고 그들은 춤과 즐거운 노래로 즐기었고, 저녁이 될 때까지 머물렀다. 즐기는 이들에게 검은 저녁이 이르렀도다. 그때 그들은 각자 집으로 흩어졌고, 텔레마코스는 그 아름다운 침실, 높은 담장으로 둘러싸인, 잘 감시되는 빈 터에 있는 곳에 들어갔도다. 그리고 그는 많은 생각으로 마음속에 담아 두고 잠자리에 들었도다.
그리고 그녀, 더없이 유별난 그 여인, 그녀는 창으로 불타는 장작을 가져왔으니, 그녀는 선한 에우리클레이아, 노인 피시노라스의 딸이라, 그녀가 오디세우스가 젊을 때 재산에서 샀으니, 그녀가 아직 젊은 처녀일 때 스무 살인 그녀를, 그는 아내에게 아주 값진 값으로 주었도다. 그녀는 집안일에 잠자리를 함께하지 않았고, 그 마음에는 여인의 분노 없었으니, 그녀는 가솔들 중 그녀에게 가장 사랑스러웠고, 그녀가 아직 어린 아이였을 때 젖 먹이던 이라. 그리고 그녀는 문 닫고 짠 것 옆에 자리잡고 누웠고, 침대에 누워 부드러운 겉옷을 벗어 놓고, 그녀 늙은 여인은 주름지고 빽빽한 머리털의 겉옷을 벗어 품 안에 넣고, 그녀가 옷을 개고 다듬어 풀솜 도끼로 짠 침상 곁에 묶었도다. 그리고 그녀는 방에서 나와 문 옆에 섰고, 문은 놋쇠 자물쇠로 잠기고 빗장으로 묶고, 옷자락에 기대어, 그녀는 밤새도록 등을 대고, 그녀가 간 길을 마음속에 계획했으니, 그녀가 갈 길, 아테나가 알려준 길로다.`

  var DATA = { A: A, D: D };

  var currentMode = 'A';
  var seg = document.getElementById('modeSeg');
  var bodyTextEl = document.getElementById('bodyText');
  var workHeadEl = document.getElementById('workHead');
  var modeTagEl = document.getElementById('modeTag');

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(mode){
    var entry = DATA[mode];
    if(!entry) return;
    workHeadEl.innerHTML =
      '<h2>호메로스 《오디세이아》 제1권</h2>' +
      '<div class="sub">' + entry.subtitle + '</div>';
    var paragraphs = entry.body.split(/\n\s*\n/).map(function(p){
      return p.replace(/\n/g,' ').trim();
    }).filter(Boolean);
    var html = paragraphs.map(function(p,i){
      return '<p class="' + ((i===0 || p.indexOf('"')===0 || p.indexOf('‘')===0) ? 'break' : '') + '">' + escapeHtml(p) + '</p>';
    }).join('');
    bodyTextEl.innerHTML = html;
    modeTagEl.textContent = mode==='A' ? 'A형 · 서사시 문어체' : 'D형 · 현대 독자용';
  }

  seg.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var mode = this.dataset.mode;
      if(mode===currentMode) return;
      seg.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
      this.classList.add('active');
      currentMode = mode;
      var body = document.getElementById('bodyText');
      body.classList.add('fade');
      setTimeout(function(){ render(mode); body.classList.remove('fade'); }, 150);
    });
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
      var buttons = Array.prototype.slice.call(seg.querySelectorAll('button'));
      var idx = buttons.findIndex(function(b){ return b.classList.contains('active'); });
      var next = e.key==='ArrowLeft' ? (idx-1+buttons.length)%buttons.length : (idx+1)%buttons.length;
      buttons[next].click();
      e.preventDefault();
    }
  });

  var startX = 0;
  document.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; });
  document.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 80){
      var buttons = Array.prototype.slice.call(seg.querySelectorAll('button'));
      var idx = buttons.findIndex(function(b){ return b.classList.contains('active'); });
      var next = dx>0 ? (idx+1)%buttons.length : (idx-1+buttons.length)%buttons.length;
      buttons[next].click();
    }
  });

  render('A');
})();
</script>
</body>
</html>
